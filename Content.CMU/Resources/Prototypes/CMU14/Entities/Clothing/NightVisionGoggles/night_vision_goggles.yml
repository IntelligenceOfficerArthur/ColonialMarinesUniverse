- type: entity
  parent: RMCHelmetGarbToggleableBase
  id: CMUGlassesNightVisionGoggles
  name: brand new M1 multi-spectrum visor
  description: A fresh-from-the-crate M1 multi-spectrum visor. Clip it onto your helmet and flip it down to see in the dark, but the green glow of the tubes gives the wearer away, and the wiring still shorts out every so often. A screwdriver will set it right.
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Clothing/HelmetGarb/nv_goggles_alt.rsi
    state: icon
  - type: Item
    sprite: _RMC14/Objects/Clothing/HelmetGarb/nv_goggles_alt.rsi
  - type: HelmetAccessory
    rsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/nv_goggles_alt.rsi
      state: helmet
    toggledRsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/nv_goggles_alt.rsi
      state: helmet-down
    hatRsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/nv_goggles_alt.rsi
      state: hat
    hatToggledRsi:
      sprite: _RMC14/Objects/Clothing/HelmetGarb/nv_goggles_alt.rsi
      state: hat-down
  # Switched on and off by CMUNightVisionGoggles while the visor is flipped down on a worn helmet.
  - type: NightVisionItem
    actionId: null
    toggleable: false
    enableOnEquip: false
    green: true
    defaultState: Full
    blockScopes: true
  - type: CMUNightVisionGoggles

- type: entity
  parent: ActionMarineBase
  id: CMUActionToggleNightVisionGoggles
  name: Toggle M1 multi-spectrum visor
  description: Flip your helmet's visor down to see in the dark, or back up. It glows while on.
  components:
  - type: Action
    useDelay: 0.5
  - type: Sprite
    layers:
    - sprite: _RMC14/Objects/Clothing/HelmetGarb/nv_goggles_alt.rsi
      state: icon
      map: ["enum.ActionVisuals.Icon"]
  - type: InstantAction
    event: !type:CMUToggleNightVisionGogglesActionEvent

# The green glow that gives a visor wearer away in the dark. Spawned on the wearer while the visor is on.
- type: entity
  id: CMUNightVisionGogglesGlow
  categories: [ HideSpawnMenu ]
  components:
  - type: PointLight
    color: "#5cff6e"
    radius: 2.5
    energy: 1.2
    softness: 1
